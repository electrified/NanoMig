name: Build and release NanoMig

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency: nanomig-release

env:
  TAG: nanomig-build-${{ github.sha }}

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check whether this commit has already been released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          build=$(gh api graphql -F owner='{owner}' -F repo='{repo}' -f tag="$TAG" \
            -f query='query($owner:String!, $repo:String!, $tag:String!) {
              repository(owner:$owner, name:$repo) { release(tagName:$tag) { isDraft } }
            }' --jq '.data.repository.release.isDraft != false')
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GOWIN_ARCHIVE: Gowin_V1.9.11.03_Education_Linux.tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            grc libasound2t64 libnss3 libgl1 libglu1-mesa libfontconfig1 libfreetype6 \
            libxrender1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxi6 libxss1 libxkbcommon-x11-0

      - name: Restore Gowin download
        id: gowin-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gowin.tar.gz
          key: ${{ env.GOWIN_ARCHIVE }}

      - name: Install Gowin EDA
        id: setup
        run: |
          archive="$RUNNER_TEMP/gowin.tar.gz"
          mkdir -p "$RUNNER_TEMP/gowin"
          if [[ ! -s $archive ]]; then
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 1200 \
              --output "$archive" "https://eda.gowinsemi.cn/$GOWIN_ARCHIVE"
          fi
          tar -xzf "$archive" -C "$RUNNER_TEMP/gowin"
          gowin_bin=$(dirname "$(find "$RUNNER_TEMP/gowin" -path '*/IDE/bin/gw_sh' -type f -print -quit)")
          test -x "$gowin_bin/gw_sh"
          echo "$gowin_bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$gowin_bin/../lib" >> "$GITHUB_ENV"
          echo 'QT_QPA_PLATFORM=offscreen' >> "$GITHUB_ENV"

      - name: Cache Gowin download
        if: steps.gowin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gowin.tar.gz
          key: ${{ env.GOWIN_ARCHIVE }}

      - name: Build nano20k
        if: &build_target_if ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BOARD: tang_nano20k
          BUILD_ARGS: nano20k
        run: &build_target |
          cd src
          read -r -a args <<< "$BUILD_ARGS"
          LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libfreetype.so.6 bash -e ./build.sh "${args[@]}"
          output="impl/pnr/nanomig_$BOARD"
          test -s "$output.fs"
          test -s "$output.bin"
          mkdir -p ../release
          cp "$output.fs" "$output.bin" ../release/

      - name: Build nano20k aga
        if: *build_target_if
        env:
          BOARD: tang_nano20k_aga
          BUILD_ARGS: nano20k aga
        run: *build_target

      - name: Build nano20k lcd
        if: *build_target_if
        env:
          BOARD: tang_nano20k_lcd
          BUILD_ARGS: nano20k lcd
        run: *build_target

      - name: Build nano20k aga lcd
        if: *build_target_if
        env:
          BOARD: tang_nano20k_aga_lcd
          BUILD_ARGS: nano20k aga lcd
        run: *build_target

      - name: Build tp25k
        if: *build_target_if
        env:
          BOARD: tang_primer25k
          BUILD_ARGS: tp25k
        run: *build_target

      - name: Build tp25k aga
        if: *build_target_if
        env:
          BOARD: tang_primer25k_aga
          BUILD_ARGS: tp25k aga
        run: *build_target

      - name: Build gw5a_25
        if: *build_target_if
        env:
          BOARD: mistle_gw5a_25
          BUILD_ARGS: gw5a_25
        run: *build_target

      - name: Publish successful targets
        if: ${{ !cancelled() && hashFiles('release/*.bin') != '' }}
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --draft \
              --title "NanoMig ${GITHUB_SHA:0:7}" --notes "Gowin build of $GITHUB_SHA."
          gh release upload "$TAG" nanomig_*.fs nanomig_*.bin --clobber
          gh release edit "$TAG" --draft=false
